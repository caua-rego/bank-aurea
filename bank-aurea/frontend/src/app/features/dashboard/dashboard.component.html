<div class="dashboard-wrapper page-fade-in">
    <!-- SIDEBAR NAVIGATION -->
    <aside class="glass-sidebar">
        <div class="brand">
            <span class="symbol">✦</span> Auréa
        </div>

        <nav class="nav-menu">
            <a class="nav-item" routerLink="/dashboard" routerLinkActive="active"
                [routerLinkActiveOptions]="{exact: true}">
                <span class="icon">▀</span> Overview
            </a>
            <a class="nav-item" routerLink="/dashboard/cards" routerLinkActive="active">
                <span class="icon">💳</span> Cards
            </a>
            <a class="nav-item" routerLink="/dashboard" [queryParams]="{action: 'transfer'}" routerLinkActive="active">
                <span class="icon">↔</span> Transfers
            </a>
            <a class="nav-item" routerLink="/dashboard/settings" routerLinkActive="active">
                <span class="icon">⚙</span> Settings
            </a>
            @if (user()?.is_admin) {
            <a class="nav-item" routerLink="/admin" routerLinkActive="active">
                <span class="icon">🛠</span> Admin Panel
            </a>
            }
            <a class="nav-item home-btn" routerLink="/">
                <span class="icon">🏠</span> Home
            </a>
        </nav>

        <div class="user-profile">
            <div class="avatar">
                @if (user()?.profile_image) {
                    <img [src]="user()?.profile_image" alt="Profile image">
                } @else {
                    {{ user()?.username?.charAt(0) | uppercase }}
                }
            </div>
            <div class="info">
                <span class="name">{{ user()?.username }}</span>
                <span class="role">{{ (user()?.tier || 'free') | titlecase }} Member</span>
            </div>
            <button (click)="logout()" class="logout-btn">
                <span class="icon">➜</span>
            </button>
        </div>
    </aside>

    <!-- MAIN CONTENT AREA -->
    <main class="dashboard-main">
        <router-outlet></router-outlet>
    </main>
</div>
