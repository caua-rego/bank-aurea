openapi: 3.0.3
info:
  title: Bank Aurea API
  version: 1.1.0
  description: REST API for authentication, accounts, transactions, cards, and profile.
servers:
  - url: http://localhost:5001
    description: Local
security:
  - cookieAuth: []
paths:
  /healthz:
    get:
      summary: Health check
      responses:
        '200': {description: OK}

  /auth/register:
    post:
      summary: Register a new user and bootstrap an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201': {description: User created, content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}}
        '400': {description: Invalid input, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '429': {description: Rate limited}
  /auth/login:
    post:
      summary: Authenticate user via session cookie
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200': {description: Authenticated, content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}}
        '401': {description: Invalid credentials}
  /auth/logout:
    post:
      summary: Logout current session
      responses:
        '200': {description: Logged out}
  /auth/me:
    get:
      summary: Return current authenticated user
      responses:
        '200': {description: User data, content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}}
        '401': {description: Unauthorized}

  /dashboard:
    get:
      summary: Get account, card, and transaction overview
      responses:
        '200':
          description: Dashboard payload
          content:
            application/json:
              schema:
                type: object
                properties:
                  account: { $ref: '#/components/schemas/Account' }
                  card: { $ref: '#/components/schemas/Card' }
                  transactions:
                    type: array
                    items: { $ref: '#/components/schemas/Transaction' }
        '401': {description: Unauthorized}

  /transfer:
    post:
      summary: Transfer funds to another account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferRequest'
      responses:
        '200': {description: Transfer success}
        '400': {description: Validation or business error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {description: Unauthorized}
        '429': {description: Rate limited}

  /deposit:
    post:
      summary: Deposit funds to current user's account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AmountRequest'
      responses:
        '200': {description: Deposit success}
        '400': {description: Validation error}
        '401': {description: Unauthorized}
        '429': {description: Rate limited}

  /withdraw:
    post:
      summary: Withdraw funds from current user's account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AmountRequest'
      responses:
        '200': {description: Withdrawal success}
        '400': {description: Validation error}
        '401': {description: Unauthorized}
        '429': {description: Rate limited}

  /users/profile:
    put:
      summary: Update profile preferences and optional image upload
      requestBody:
        required: false
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                preferences: {type: string, description: JSON stringified preferences}
                profile_image: {type: string, format: binary}
          application/json:
            schema:
              type: object
              properties:
                preferences: {type: object}
                profile_image: {type: string, description: URL or base64}
      responses:
        '200': {description: Profile updated}
        '400': {description: Validation error}
        '401': {description: Unauthorized}

  /cards/:
    get:
      summary: List cards for current user
      responses:
        '200': {description: Cards, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Card'}}}}}
        '401': {description: Unauthorized}
  /cards/generate:
    post:
      summary: Generate a new card (rate limited)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                type: {type: string, enum: [virtual, physical], default: virtual}
      responses:
        '201': {description: Card created}
        '400': {description: Invalid request}
        '401': {description: Unauthorized}
        '429': {description: Rate limited}
  /cards/{card_id}:
    delete:
      summary: Delete a card
      parameters:
        - in: path
          name: card_id
          required: true
          schema: {type: integer}
      responses:
        '200': {description: Deleted}
        '403': {description: Forbidden}
        '404': {description: Not found}
  /cards/{card_id}/reveal:
    get:
      summary: Reveal full card data
      parameters:
        - in: path
          name: card_id
          required: true
          schema: {type: integer}
      responses:
        '200': {description: Card data}
        '403': {description: Forbidden}
        '404': {description: Not found}

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: session
  schemas:
    User:
      type: object
      properties:
        id: {type: integer}
        username: {type: string}
        email: {type: string}
        is_admin: {type: boolean}
        profile_image: {type: string}
        preferences: {type: object}
        tier: {type: string}
    Account:
      type: object
      properties:
        id: {type: integer}
        number: {type: string}
        balance: {type: string}
        owner: {type: string}
    Transaction:
      type: object
      properties:
        id: {type: integer}
        source: {type: integer}
        target: {type: integer}
        amount: {type: string}
        type: {type: string}
        timestamp: {type: string, format: date-time}
    Card:
      type: object
      properties:
        id: {type: integer}
        number: {type: string}
        holder_name: {type: string}
        expiry: {type: string}
        card_type: {type: string}
        tier: {type: string}
        cvv: {type: string}
    Error:
      type: object
      properties:
        error: {type: string}
    RegisterRequest:
      type: object
      required: [username, email, password]
      properties:
        username: {type: string}
        email: {type: string, format: email}
        password: {type: string, format: password}
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: {type: string, format: email}
        password: {type: string, format: password}
    TransferRequest:
      type: object
      required: [target_account, amount]
      properties:
        target_account: {type: string}
        amount: {type: string, example: "100.00"}
    AmountRequest:
      type: object
      required: [amount]
      properties:
        amount: {type: string, example: "50.00"}
