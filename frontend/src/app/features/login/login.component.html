<div class="auth-page page-fade-in">
    <div class="auth-card liquid-card">
        <div class="brand-header">
            <span class="symbol">✦</span> Bank Auréa
        </div>

        <h2>Welcome Back</h2>
        <p class="subtitle">Enter your credentials to access your workspace.</p>

        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input id="email" type="email" placeholder="name@example.com" formControlName="email">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input id="password" type="password" placeholder="••••••••" formControlName="password">
            </div>

            @if (errorMessage) {
            <div class="error-banner">
                <span class="icon">⚠️</span> {{ errorMessage }}
            </div>
            }

            <button type="submit" class="btn-gold" [disabled]="!loginForm.valid">
                Sign In
            </button>

            <div class="auth-footer">
                <p>Don't have an ID? <a routerLink="/register">Create Account</a></p>
                <a routerLink="/" class="back-link">Return Home</a>
            </div>
        </form>
    </div>
</div>
